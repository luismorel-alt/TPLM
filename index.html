<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>TPLM - Productos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@200;300;400;600&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="./src/css/styles.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">TPLM</a>
        <button class="btn btn-outline-dark" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight" aria-controls="offcanvasRight" aria-label="Abrir carrito">
          <i class="bi bi-cart-plus" aria-hidden="true"></i> Carrito <span class="badge text-bg-dark" id="cart-count">0</span>
        </button>
      </div>
    </nav>

    <main class="container">
      <section class="catalog-controls mt-4" aria-label="Buscar y filtrar productos">
        <label class="form-label" for="search-input">Search product</label>
        <input class="form-control" type="search" name="search" id="search-input" placeholder="Search by name or description" />
        <div class="d-flex flex-wrap gap-2 mt-3" id="category-filters" aria-label="Filtrar por categoría"></div>
      </section>
      <div
        class="row row-cols-1 row-cols-md-4 g-4 mt-5"
        id="product-list"
      ></div>
      <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
        <div class="offcanvas-header">
          <h2 class="offcanvas-title fs-5" id="offcanvasRightLabel">Lista de compras</h2>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar carrito"></button>
        </div>
        <div class="offcanvas-body" id="cart-items" aria-live="polite"></div>
        <div class="offcanvas-footer border-top p-3">
          <p class="d-flex justify-content-between mb-3"><strong>Total</strong><strong id="cart-total">U$S 0.00</strong></p>
          <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-dark" id="checkout-btn" type="button">Finalizar compra</button>
            <button class="btn btn-outline-secondary" id="clear-cart-btn" type="button">Vaciar carrito</button>
          </div>
        </div>
      </div>
      <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="cart-toast" class="toast" role="status" aria-live="polite" aria-atomic="true">
          <div class="toast-header"><strong class="me-auto">Carrito</strong><button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Cerrar"></button></div>
          <div class="toast-body" id="cart-toast-message"></div>
        </div>
      </div>

      <!-- Button trigger modal -->
      <div
        class="modal fade"
        id="productModal"
        tabindex="-1"
        aria-labelledby="productModalLabel"
        aria-hidden="true"
      ></div>
    </main>
    <footer class="text-center bg-dark text-white py-3">
      <p class="m-0">TP E-Commerce | Laboratorio de Aplicaciones Web Cliente | Luis Morel</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./src/index.js"></script>
  </body>
</html>
